for(const f of c.f){const v=$('f_'+f[0]).value;r[f[0]]=f[0]==='password'?v:v.trim();if(f[1].endsWith('*')&&!r[f[0]].trim())return toast('Kolom bertanda * wajib diisi!','err')}
if(cat==='account'){r.nama=r.platform;r.foto='';r.isArchived=false}else r.foto=photo,r.isArchived=old?!!old.isArchived:false;
r.extraPhotos=old&&old.extraPhotos||[];r.fav=!!(old&&old.fav);

let pickT,CR=null;const crPts=new Map();
function watchPick(){let o=0;const f=()=>{o=1};addEventListener('blur',f,{once:true});document.addEventListener('visibilitychange',f,{once:true});clearTimeout(pickT);pickT=setTimeout(()=>{if(!o)toast('Galeri tidak terbuka? Coba buka aplikasi ini lewat Chrome atau Safari.','err')},2000)}

async function openCrop(src,done){const b=await bmp(src),S=300,mn=Math.max(S/b.width,S/b.height);CR={b,S,mn,s:mn,x:(S-b.width*mn)/2,y:(S-b.height*mn)/2,done};$('cg').style.borderRadius=cat==='person'?'50%':'18px';crDraw();show($('cr'))}
function crDraw(){const{b,S,mn}=CR;CR.s=Math.max(mn,Math.min(mn*6,CR.s));const w=b.width*CR.s,h=b.height*CR.s;CR.x=Math.min(0,Math.max(S-w,CR.x));CR.y=Math.min(0,Math.max(S-h,CR.y));const c=$('cc').getContext('2d');c.clearRect(0,0,S,S);c.drawImage(b,CR.x,CR.y,w,h);$('crz').value=CR.s/mn}
function crZoom(f,cx,cy){const n=Math.max(CR.mn,Math.min(CR.mn*6,CR.s*f)),r=n/CR.s;CR.x=cx-(cx-CR.x)*r;CR.y=cy-(cy-CR.y)*r;CR.s=n;crDraw()}
{const cc=$('cc');
cc.onpointerdown=e=>{try{cc.setPointerCapture(e.pointerId)}catch(_){}crPts.set(e.pointerId,[e.clientX,e.clientY])};
cc.onpointermove=e=>{if(!CR||!crPts.has(e.pointerId))return;const r=cc.getBoundingClientRect(),k=CR.S/r.width,p=crPts.get(e.pointerId);
if(crPts.size===1){CR.x+=(e.clientX-p[0])*k;CR.y+=(e.clientY-p[1])*k;crPts.set(e.pointerId,[e.clientX,e.clientY]);crDraw()}
else if(crPts.size===2){const o=[...crPts.entries()].find(([id])=>id!==e.pointerId)[1],d0=Math.hypot(p[0]-o[0],p[1]-o[1]);crPts.set(e.pointerId,[e.clientX,e.clientY]);const d1=Math.hypot(e.clientX-o[0],e.clientY-o[1]);if(d0>0)crZoom(d1/d0,((e.clientX+o[0])/2-r.left)*k,((e.clientY+o[1])/2-r.top)*k)}};
cc.onpointerup=cc.onpointercancel=e=>crPts.delete(e.pointerId);
cc.onwheel=e=>{if(!CR)return;e.preventDefault();const r=cc.getBoundingClientRect(),k=CR.S/r.width;crZoom(e.deltaY<0?1.1:.9,(e.clientX-r.left)*k,(e.clientY-r.top)*k)};
$('crz').oninput=e=>{if(CR)crZoom(e.target.value*CR.mn/CR.s,CR.S/2,CR.S/2)};
